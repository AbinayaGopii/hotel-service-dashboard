<div class="shell">
  <aside class="side">
    <div class="brand">Stayline<small>Hotel Guest Service</small></div>
    <nav>
      <a routerLink="/home" routerLinkActive="on">🏠 <span>Home</span></a>
      <div class="grp">Department-wise</div>
      @for (d of depts; track d.slug) {
        <a [routerLink]="['/department', d.slug]" routerLinkActive="on"><i class="dot" [style.background]="d.color"></i><span>{{ d.name }}</span></a>
      }
    </nav>
  </aside>
  <div class="body">
    <app-filter-bar />
    <main><router-outlet /></main>
  </div>
</div>
